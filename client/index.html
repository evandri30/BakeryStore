<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rizquna Bakery: roti, brownies, donat, puding, dan bolu yang dipanggang setiap hari." />
    <meta name="theme-color" content="#fffcf7" />
    <script>
      // Set the theme before the first paint: the saved choice, otherwise the device theme.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('rizquna-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c130d')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <title>Rizquna Bakery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
